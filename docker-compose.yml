name: sysbimbo

services:
  postgres:
    image: postgres:16-alpine
    container_name: sysbimbo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sysbimbo_formulario
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe configurarse en .env}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50", "-c", "work_mem=4MB"]
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d sysbimbo_formulario"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: sysbimbo-backend:latest
    build:
      context: .
      dockerfile: backend/Sysbimbo.Api/Dockerfile
    container_name: sysbimbo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__FormularioPostgres: "Host=postgres;Port=5432;Database=sysbimbo_formulario;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};"
      SeedAdmin__Password: "${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD debe configurarse en .env}"
      DOTNET_gcServer: "0"
    expose:
      - "8080"

  frontend:
    image: sysbimbo-frontend:latest
    build:
      context: .
      dockerfile: frontend/sysbimbo-app/Dockerfile
    container_name: sysbimbo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
