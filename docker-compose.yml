name: sysbimbo

services:
  postgres:
    image: postgres:16-alpine
    container_name: sysbimbo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sysbimbo_formulario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sysbimbo2026!Pass
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50", "-c", "work_mem=4MB"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/Database/formulario_postgresql.sql:/docker-entrypoint-initdb.d/01_formulario_postgresql.sql
      - ./backend/Database/datos_formulario_postgresql.sql:/docker-entrypoint-initdb.d/02_datos_formulario_postgresql.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sysbimbo_formulario"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: sysbimbo-backend:latest
    build:
      context: .
      dockerfile: backend/Sysbimbo.Api/Dockerfile
    container_name: sysbimbo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__FormularioPostgres: "Host=postgres;Port=5432;Database=sysbimbo_formulario;Username=postgres;Password=Sysbimbo2026!Pass;"
      DOTNET_gcServer: "0"
    ports:
      - "5105:8080"

  frontend:
    image: sysbimbo-frontend:latest
    build:
      context: .
      dockerfile: frontend/sysbimbo-app/Dockerfile
    container_name: sysbimbo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
