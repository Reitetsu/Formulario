server {
    listen 80;
    server_name innovamsp.lat www.innovamsp.lat 79.143.88.66 _;

    # Redirigir la raíz HTTP / hacia /canjes_Agosto
    location = / {
        return 302 /canjes_Agosto;
    }

    # Redirigir peticiones HTTP a HTTPS si existen los certificados
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend API
    location /api/ {
        client_max_body_size 11m;
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy hacia Swagger UI
    location /swagger {
        proxy_pass http://backend:8080/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name innovamsp.lat www.innovamsp.lat 79.143.88.66;

    ssl_certificate /etc/letsencrypt/live/innovamsp.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innovamsp.lat/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Redirección de la raíz HTTPS / hacia /canjes_Agosto
    location = / {
        return 302 /canjes_Agosto;
    }

    # 2. Rutas conocidas manejadas por Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Proxy hacia el backend API
    location /api/ {
        client_max_body_size 11m;
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Proxy hacia Swagger UI
    location /swagger {
        proxy_pass http://backend:8080/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
