<main class="login-page">
  <section class="login-card">
    <a class="back-link" routerLink="/canjes_Agosto" aria-label="Volver al formulario">&larr; Volver</a>

    <div class="login-heading">
      <span class="brand-seal">SB</span>
      <span class="eyebrow">Acceso privado</span>
      <h1>Iniciar sesión</h1>
      <p>Ingresa tus credenciales para acceder al panel de supervisión.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="usuario">Usuario</label>
      <input id="usuario" type="text" formControlName="usuario" autocomplete="username" placeholder="Tu usuario">

      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder="Tu contraseña">

      @if (errorMessage) {
        <p class="login-error" role="alert">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <small>La sesión se cerrará automáticamente al terminar el día.</small>
  </section>
</main>
